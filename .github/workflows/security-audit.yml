name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository security audit
        # Invoke the checked-in auditor directly so a compromised package.json
        # cannot replace the security check with another command.
        run: node scripts/security-audit.mjs
